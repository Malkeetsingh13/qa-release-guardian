name: QA Release Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run QA Release Gate
        run: npm run release:gate

      - name: Upload Cypress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-evidence
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore